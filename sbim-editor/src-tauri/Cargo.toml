[package]
name = "sbim-editor"
version = "0.1.0"
description = "SBIM Floor Plan Editor"
authors = ["Seoul Gaok"]
license = ""
repository = ""
edition = "2021"

[lib]
name = "sbim_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
