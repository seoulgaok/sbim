name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: python (gen --check · pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          # uv.lock 의 requires-python(>=3.11) 안에서 3.12 로 고정
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      # dev 는 dependency-group 이 아니라 optional-dependencies 라 --extra 로 받는다.
      # ifc extra 도 받는다 — IFC 정답(fixtures/ifc/)이 ifc.py 와 같은지 봐야 Elixir 판(elixir/sbim/lib/sbim/ifc.ex)이 갈리지 않는다.
      - name: uv sync (dev · ifc extra)
        run: uv sync --locked --extra dev --extra ifc

      - name: python version
        run: uv run python --version

      # schema/*.json · typescript/src/options.ts · fixtures/ 가 정본(pydantic)과 같은가
      - name: gen_build_options --check
        run: uv run python scripts/gen_build_options.py --check

      # fixtures/ifc/ 정답 · elixir/sbim/lib/sbim/generated/ifc_schema.ex 가 ifc.py · ifcopenshell 과 같은가
      - name: gen_ifc_fixtures --check · gen_ifc_schema --check
        run: |
          uv run python scripts/gen_ifc_fixtures.py --check
          uv run python scripts/gen_ifc_schema.py --check

      - name: pytest
        run: uv run pytest -q

  typescript:
    name: typescript (build · dist 동기 · test)
    runs-on: ubuntu-latest
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@v4

      # setup-node 의 cache: pnpm 은 pnpm 이 먼저 PATH 에 있어야 한다 → corepack 을 앞에 둔다
      - name: corepack enable
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: pnpm version is package.json packageManager
        run: |
          want=$(node -p "require('./package.json').packageManager.split('@')[1]")
          have=$(pnpm --version)
          echo "packageManager=pnpm@$want  pnpm=$have"
          test "$have" = "$want"

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: pnpm -r build
        run: pnpm -r build

      # typescript/dist 는 git URL 설치 때문에 추적한다(.gitignore 주석).
      # 소스와 다르면(수정·신규 파일 모두) 실패 — `pnpm -r build` 뒤 커밋하라는 뜻.
      - name: dist is in sync with source
        run: |
          if [ -n "$(git status --porcelain -- typescript/dist)" ]; then
            echo "::error::typescript/dist 가 소스와 다르다 — pnpm -r build 후 커밋하라"
            git status --porcelain -- typescript/dist
            git diff -- typescript/dist
            exit 1
          fi

      - name: pnpm -r test
        run: pnpm -r test

  elixir:
    name: elixir (mix test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: elixir/sbim
    steps:
      - uses: actions/checkout@v4

      # 로컬과 같은 조합(Elixir 1.20.4 / OTP 29) — builds.hex.pm 에 v1.20.4-otp-29 가 있다
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.4"
          otp-version: "29"

      - name: mix deps.get
        run: mix deps.get

      # 손으로 쓰는 파일만 — lib/sbim/generated/ 는 .formatter.exs 의 inputs 에 없다
      - name: mix format --check-formatted
        run: mix format --check-formatted

      # lib/sbim/generated/ 는 python job 의 gen_build_options --check 가 정본과 같은지 지킨다
      - name: mix test
        run: mix test

  rust:
    name: rust (cargo test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/sbim-types

      # src/*.rs 생성 파일은 python job 의 gen_build_options --check 가 정본과 같은지 지킨다.
      # --locked: Cargo.lock 을 추적하니 갱신되면 실패 — 의존을 바꿀 땐 lock 도 같이 커밋하라.
      - name: cargo test
        run: cargo test --locked --manifest-path rust/sbim-types/Cargo.toml
